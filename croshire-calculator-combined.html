<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Croshire Estates Corp - Deal Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
/* Color Palette & Variables */
:root {
    --bg-base: #0A0A0A;
    --card-surface: rgba(20, 20, 20, 0.85);
    --gold-molten: #C9A84C;
    --gold-glow: rgba(201, 168, 76, 0.4);
    --green-noi: #22C55E;
    --red-fail: #EF4444;
    --font-serif: 'Cinzel', serif;
    --font-sans: 'Inter', sans-serif;
}

body {
    margin: 0;
    padding: 0;
    background-color: #050505;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: var(--font-sans);
    color: var(--gold-molten);
}

.tablet-container {
    background: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%);
    padding: 10px;
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8), 
                0 0 0 2px #333;
    perspective: 1000px;
}

.screen {
    width: 1100px;
    height: 650px;
    background-color: var(--bg-base);
    background-image: repeating-linear-gradient(45deg, #0A0A0A 25%, transparent 25%, transparent 75%, #0A0A0A 75%, #0A0A0A), repeating-linear-gradient(45deg, #0A0A0A 25%, #0d0d0d 25%, #0d0d0d 75%, #0A0A0A 75%, #0A0A0A);
    background-position: 0 0, 2px 2px;
    background-size: 4px 4px;
    border-radius: 16px;
    border: 2px solid var(--gold-molten);
    box-shadow: inset 0 0 20px rgba(0,0,0,0.9),
                0 0 15px var(--gold-glow);
    padding: 20px 30px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
}

.screen::before {
    content: '';
    position: absolute;
    top: 10px;
    left: 20px;
    right: 20px;
    height: 4px;
    background: linear-gradient(90deg, transparent, var(--gold-molten), transparent);
    border-radius: 2px;
}

.bottom-accent {
    position: absolute;
    bottom: 10px;
    left: 20px;
    right: 20px;
    height: 4px;
    background: linear-gradient(90deg, transparent, var(--gold-molten), transparent);
    border-radius: 2px;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 15px;
    margin-bottom: 5px;
}

.logo-placeholder {
    display: flex;
    flex-direction: column;
    text-align: center;
}

.logo-title {
    font-family: var(--font-serif);
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 2px;
    text-shadow: 0 0 5px var(--gold-glow);
}

.logo-sub {
    font-size: 10px;
    letter-spacing: 1px;
}

.logo-bottom {
    font-family: var(--font-serif);
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 3px;
}

.nav-tabs {
    display: flex;
    gap: 10px;
}

.tab {
    background: var(--card-surface);
    border: 1px solid rgba(201, 168, 76, 0.3);
    color: #888;
    padding: 8px 16px;
    border-radius: 4px;
    font-family: var(--font-sans);
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s ease;
}

.tab:hover {
    color: var(--gold-molten);
    border-color: var(--gold-molten);
}

.tab.active {
    color: var(--gold-molten);
    border-color: var(--gold-molten);
    box-shadow: 0 0 10px var(--gold-glow);
}

.sub-nav {
    text-align: right;
    font-size: 12px;
    letter-spacing: 2px;
    margin-bottom: 20px;
    opacity: 0.8;
}

.dashboard {
    display: flex;
    gap: 20px;
    flex-grow: 1;
}

.panel {
    background: var(--card-surface);
    border: 1px solid rgba(201, 168, 76, 0.4);
    border-radius: 12px;
    padding: 20px;
    backdrop-filter: blur(10px);
    box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 
                0 5px 15px rgba(0,0,0,0.8);
}

.left-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.input-row {
    display: flex;
    align-items: center;
    gap: 15px;
}

.prefix {
    background: var(--bg-base);
    border: 1px solid var(--gold-molten);
    width: 40px;
    height: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 6px;
    font-family: var(--font-serif);
    font-weight: bold;
    font-size: 18px;
    box-shadow: 0 0 8px var(--gold-glow);
}

.text-input {
    background: var(--bg-base);
    border: 1px solid var(--gold-molten);
    height: 40px;
    width: 120px;
    border-radius: 6px;
    color: white;
    padding: 0 10px;
    outline: none;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
}

.gold-slider {
    -webkit-appearance: none;
    flex-grow: 1;
    height: 4px;
    background: #333;
    border-radius: 2px;
    outline: none;
}

.gold-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffe180, var(--gold-molten));
    cursor: pointer;
    box-shadow: 0 0 10px var(--gold-molten);
}

.right-panel {
    flex: 1.2;
    display: flex;
    flex-direction: column;
    gap: 15px;
    background: transparent;
    border: none;
    padding: 0;
    box-shadow: none;
}

.card {
    background: var(--card-surface);
    border: 1px solid var(--gold-molten);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 5px 15px rgba(0,0,0,0.8), inset 0 0 10px rgba(201, 168, 76, 0.1);
}

.hero-card {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    box-shadow: 0 0 20px var(--gold-glow);
}

.card-label {
    font-size: 14px;
    letter-spacing: 1px;
    margin-bottom: 10px;
    color: #eee;
}

.hero-value {
    font-family: var(--font-serif);
    font-size: 56px;
    font-weight: 700;
    text-shadow: 0 0 15px var(--gold-glow);
}

.kpi-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.kpi-value {
    font-family: var(--font-serif);
    font-size: 32px;
    font-weight: 600;
    text-shadow: 0 0 8px var(--gold-glow);
}

.noi-green {
    color: var(--green-noi);
    font-family: var(--font-sans);
    text-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
}

.dscr-buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
}

.btn-pass, .btn-fail {
    background: var(--bg-base);
    border: 1px solid #555;
    color: #888;
    padding: 8px 24px;
    border-radius: 6px;
    font-family: var(--font-sans);
    font-size: 16px;
}

.btn-pass {
    border-color: var(--green-noi);
    color: var(--green-noi);
    box-shadow: inset 0 0 10px rgba(34, 197, 94, 0.2);
}

.btn-fail {
    border-color: var(--red-fail);
    color: var(--red-fail);
}

.footer-text {
    text-align: right;
    font-size: 12px;
    opacity: 0.6;
    margin-top: -5px;
}

</style>
</head>
<body>

<div class="tablet-container">
    <div class="screen">
        
        <header class="top-bar">
            <div class="logo-area">
                <div class="logo-placeholder">
                    <span class="logo-title">CROSHIRE</span>
                    <span class="logo-sub">PRIVATE CAPITAL CONSULTING</span>
                    <span class="logo-bottom">CAPITAL</span>
                </div>
            </div>
            
            <nav class="nav-tabs">
                <button class="tab active" onclick="switchTab('underwrite',this)">Underwrite</button>
                <button class="tab" onclick="switchTab('velocity',this)">Velocity</button>
                <button class="tab" onclick="switchTab('valueadd',this)">Value Add</button>
                <button class="tab" onclick="switchTab('zeroout',this)">Zero Out</button>
                <button class="tab" onclick="switchTab('checklist',this)">Checklist</button>
            </nav>
        </header>
        
        <div class="sub-nav">
            REAL ESTATE • COMMERCIAL • MARINE • AVIATION
        </div>

        <main class="dashboard">
            
            <section class="panel left-panel">
                <div class="input-row">
                    <div class="prefix">$</div>
                    <input type="number" class="text-input" id="input-1" value="1200" oninput="calculate()">
                    <input type="range" class="gold-slider" id="slider-1" min="500" max="5000" value="1200" oninput="document.getElementById('input-1').value=this.value;calculate()">
                </div>
                <div class="input-row">
                    <div class="prefix">%</div>
                    <input type="number" class="text-input" id="input-2" value="0" oninput="calculate()">
                    <input type="range" class="gold-slider" id="slider-2" min="0" max="30" value="0" oninput="document.getElementById('input-2').value=this.value;calculate()">
                </div>
                <div class="input-row">
                    <div class="prefix">#</div>
                    <input type="number" class="text-input" id="input-3" value="4" oninput="calculate()">
                    <input type="range" class="gold-slider" id="slider-3" min="1" max="50" value="4" oninput="document.getElementById('input-3').value=this.value;calculate()">
                </div>
                <div class="input-row">
                    <div class="prefix">%</div>
                    <input type="number" class="text-input" id="input-4" value="90" oninput="calculate()">
                    <input type="range" class="gold-slider" id="slider-4" min="50" max="100" value="90" oninput="document.getElementById('input-4').value=this.value;calculate()">
                </div>
                <div class="input-row">
                    <div class="prefix">/</div>
                    <input type="number" class="text-input" id="input-5" value="40" oninput="calculate()">
                    <input type="range" class="gold-slider" id="slider-5" min="20" max="70" value="40" oninput="document.getElementById('input-5').value=this.value;calculate()">
                </div>
                <div class="input-row">
                    <div class="prefix">#</div>
                    <input type="number" class="text-input" id="input-6" value="6" step="0.5" oninput="calculate()">
                    <input type="range" class="gold-slider" id="slider-6" min="4" max="12" step="0.5" value="6" oninput="document.getElementById('input-6').value=this.value;calculate()">
                </div>
            </section>

            <section class="panel right-panel">
                <div class="card hero-card">
                    <div class="card-label">Offer Price</div>
                    <div class="hero-value" id="out-offer">$960,000</div>
                </div>
                
                <div class="kpi-grid">
                    <div class="card">
                        <div class="card-label">NOI</div>
                        <div class="kpi-value noi-green" id="out-noi">$31,104</div>
                    </div>
                    <div class="card">
                        <div class="card-label">DSCR</div>
                        <div class="dscr-buttons">
                            <button class="btn-pass" id="btn-pass">Pass</button>
                            <button class="btn-fail" id="btn-fail">Fail</button>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-label">Cap Rate</div>
                        <div class="kpi-value" id="out-cap">6.00%</div>
                    </div>
                    <div class="card">
                        <div class="card-label">Cash-on-Cash Return</div>
                        <div class="kpi-value" id="out-coc">5.6%</div>
                    </div>
                </div>
                <div class="footer-text">croshireestates.com</div>
            </section>

        </main>
        
        <div class="bottom-accent"></div>
    </div>
</div>

<script>
function switchTab(name, btn) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
}

function calculate() {
    const rent   = +document.getElementById('input-1').value || 0;
    const other  = (+document.getElementById('input-2').value || 0) / 100;
    const units  = +document.getElementById('input-3').value || 0;
    const occ    = (+document.getElementById('input-4').value || 90) / 100;
    const exp    = (+document.getElementById('input-5').value || 40) / 100;
    const cap    = (+document.getElementById('input-6').value || 6) / 100;

    const gross  = units * rent * 12 * (1 + other);
    const egi    = gross * occ;
    const noi    = egi * (1 - exp);
    const offer  = cap > 0 ? noi / cap : 0;
    const grm    = gross > 0 ? offer / gross : 0;

    const loan   = offer * 0.75;
    const mr     = 8.865 / 100 / 12;
    const pi     = loan > 0 ? loan * mr / (1 - Math.pow(1 + mr, -360)) : 0;
    const dscr   = (pi + 625) > 0 ? (units * rent) / (pi + 625) : 0;
    const annCF  = (units * rent * occ - (pi + 625)) * 12;
    const down   = offer * 0.25;
    const coc    = down > 0 ? (annCF / down) * 100 : 0;

    document.getElementById('out-offer').textContent = '$' + Math.round(offer).toLocaleString();
    document.getElementById('out-noi').textContent   = '$' + Math.round(noi).toLocaleString();
    document.getElementById('out-cap').textContent   = parseFloat(cap * 100).toFixed(2) + '%';
    document.getElementById('out-coc').textContent   = coc.toFixed(1) + '%';

    const pass = dscr >= 1.2;
    document.getElementById('btn-pass').style.opacity = pass ? '1' : '0.25';
    document.getElementById('btn-fail').style.opacity = pass ? '0.25' : '1';
}

calculate();
</script>
</body>
</html>
