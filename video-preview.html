<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Croshire Capital — Video Preview</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: linear-gradient(160deg, #1a0a3a, #0d0020);
  font-family: Georgia, serif;
  color: #F5DFA0;
  padding: 24px 16px;
}
h1 {
  text-align: center;
  font-size: 1.5rem;
  background: linear-gradient(135deg, #C9A84C, #F5DFA0);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.sub {
  text-align: center;
  color: #a08040;
  font-size: 0.8rem;
  letter-spacing: 1px;
  margin-bottom: 32px;
}
.block {
  max-width: 400px;
  margin: 0 auto 40px;
  border: 2px solid #C9A84C;
  border-radius: 14px;
  overflow: hidden;
  background: #1a0840;
}
.label {
  background: linear-gradient(135deg, #C9A84C, #8B6500);
  padding: 12px;
  text-align: center;
  font-size: 1.2rem;
  font-weight: bold;
  color: #1a0840;
  letter-spacing: 3px;
}
video { width: 100%; display: block; }
</style>
</head>
<body>
<h1>Croshire Capital</h1>
<p class="sub">SCROLL DOWN TO WATCH EACH VIDEO</p>

<div class="block">
  <div class="label">VIDEO 1</div>
  <video controls autoplay muted loop playsinline>
    <source src="https://raw.githubusercontent.com/ACrosbie1/croshire-site/main/croshire-video-1.mp4" type="video/mp4">
  </video>
</div>

<div class="block">
  <div class="label">VIDEO 2</div>

  </video>
</div>

<div class="block">
  <div class="label">VIDEO 3</div>
  <video controls autoplay muted loop playsinline>
    <source src="https://raw.githubusercontent.com/ACrosbie1/croshire-site/main/croshire-video-3.mp4" type="video/mp4">
  </video>
</div>

<div class="block">
  <div class="label">VIDEO 4</div>
  <video controls autoplay muted loop playsinline>

  </video>
</div>
